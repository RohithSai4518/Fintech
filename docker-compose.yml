version: '3.8'

services:
  fintech-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech_enterprise_platform
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DB_PATH=/app/data/fintech_core.db
    volumes:
      - fintech_data:/app/data
    restart: unless-stopped

volumes:
  fintech_data:
    driver: local
